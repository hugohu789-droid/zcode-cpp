<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ime-java 接口测试</title>
<style>
  :root {
    --bg: #f3f4f6;
    --card: #ffffff;
    --border: #e3e5e8;
    --title: #202124;
    --body: #3c4043;
    --muted: #80868b;
    --accent: #1a73e8;
    --accent-soft: #e8f0fe;
    --error: #c5221f;
    --ok: #0d7340;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px;
    background: var(--bg); color: var(--body);
    font-family: "Segoe UI", system-ui, sans-serif; font-size: 14px;
  }
  h1 { margin: 0 0 4px; font-size: 18px; color: var(--title); font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 14px;
  }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  select, input[type=text], input[type=number] {
    font: inherit; padding: 7px 9px;
    border: 1px solid var(--border); border-radius: 6px; background: #fff;
  }
  input[type=text] { min-width: 240px; }
  button {
    font: inherit; padding: 8px 16px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { background: #bdc1c6; cursor: default; }
  button.ghost { background: #fff; color: var(--body); border: 1px solid var(--border); }
  .path { font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
  .status { font-size: 12px; margin-top: 10px; }
  .status.err { color: var(--error); }
  .status.ok { color: var(--ok); }

  /* Results: each candidate is one vertical column, columns run left to
     right. writing-mode gives the top-to-bottom flow; sideways rotates the
     glyphs 90 degrees clockwise, which is how a Mongolian font's
     horizontally-drawn glyphs are meant to be set vertically. */
  #results {
    display: flex; flex-direction: row; flex-wrap: wrap;
    gap: 10px; align-items: flex-start;
  }
  .cand {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 6px 6px; background: #fff;
    display: flex; flex-direction: column; align-items: center;
  }
  .cand .n { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .zc {
    writing-mode: vertical-lr;
    text-orientation: sideways;
    line-height: 1.1;
    white-space: nowrap;
    color: var(--title);
  }
  .meta {
    margin-top: 6px; font-size: 10px; color: var(--muted);
    font-family: Consolas, monospace; text-align: center;
    writing-mode: horizontal-tb; max-width: 150px; word-break: break-all;
    white-space: pre-line; line-height: 1.5; text-align: left;
  }
  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  pre {
    background: #f8f9fa; border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; overflow-x: auto; font-size: 11px; max-height: 260px;
  }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<h1>ime-java 接口测试</h1>
<div class="sub">east-mod/ime 原版 Java 服务 &middot; 候选竖排,列从左到右</div>

<div class="card">
  <div class="row">
    <div>
      <label for="ep">接口</label>
      <select id="ep">
        <option value="/ime/">/ime/{key} &mdash; makeWord</option>
        <option value="/ime/fuzzy/">/ime/fuzzy/{key} &mdash; 模糊</option>
        <option value="/ime/fuzzy/score/">/ime/fuzzy/score/{key} &mdash; 模糊 + 评分</option>
        <option value="/ime/severe/">/ime/severe/{key} &mdash; 严格</option>
      </select>
    </div>
    <div>
      <label for="key">输入(拉丁键)</label>
      <input type="text" id="key" value="bagsi" autocomplete="off" spellcheck="false">
    </div>
    <div><button id="go">查询</button></div>
    <div><button id="clear" class="ghost">清空</button></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div>
      <label for="font">字体</label>
      <select id="font"></select>
    </div>
    <div>
      <label for="size">字号</label>
      <input type="number" id="size" value="34" min="12" max="96" step="2" style="width:76px">
    </div>
    <div>
      <label for="limit">最多显示</label>
      <input type="number" id="limit" value="60" min="1" max="500" step="10" style="width:76px">
    </div>
  </div>
  <div class="status" id="status"></div>
  <div class="path" id="path"></div>
</div>

<div class="card">
  <div id="results"><span class="empty">还没有结果。</span></div>
  <details>
    <summary>原始 JSON</summary>
    <pre id="raw">—</pre>
  </details>
</div>

<script>
// The Z52 faces installed on this machine, plus a Unicode Mongolian font for
// contrast: the same code points are Sibe/Manchu letters there, so picking it
// is a quick way to confirm the ZCode font is really being used.
var FONTS = [
  'Z52 Hara Tig', 'Z52 Agola Tig', 'Z52 Amogolang Tig', 'z52 Bilig Tig',
  'Z52 Chimeg Tig', 'Z52 Galt Tig', 'Z52 Garcag tig', 'Z52 Hawang Tig',
  'Noto Sans Mongolian', 'Mongolian Baiti'
];

var $ = function (id) { return document.getElementById(id); };

(function fillFonts() {
  var sel = $('font');
  FONTS.forEach(function (f) {
    var o = document.createElement('option');
    o.value = f;
    // document.fonts.check is advisory, but it catches the common case of a
    // font that is simply not installed, which would silently fall back.
    var have = true;
    try { have = document.fonts.check('32px "' + f + '"'); } catch (e) {}
    o.textContent = have ? f : f + '  (未安装?)';
    sel.appendChild(o);
  });
})();

function setStatus(text, kind) {
  var el = $('status');
  el.textContent = text;
  el.className = 'status' + (kind ? ' ' + kind : '');
}

// /ime/fuzzy/score returns "word,frequency:N,levenshteinD:N,...". Everything
// after the first comma is measurement, not text, so it must not be set in
// the Mongolian font.
function splitScored(item) {
  var at = item.indexOf(',');
  if (at < 0) return { text: item, meta: '' };
  return { text: item.slice(0, at), meta: item.slice(at + 1) };
}

function codePoints(text) {
  var out = [];
  for (var i = 0; i < text.length; i++) {
    out.push('U+' + text.charCodeAt(i).toString(16).toUpperCase().padStart(4, '0'));
  }
  return out.join(' ');
}

function render(items) {
  var box = $('results');
  box.innerHTML = '';
  if (!items.length) {
    box.innerHTML = '<span class="empty">没有候选。</span>';
    return;
  }
  var font = $('font').value;
  var size = $('size').value;
  var limit = parseInt($('limit').value, 10) || items.length;
  items.slice(0, limit).forEach(function (item, i) {
    var parts = splitScored(String(item));
    var cell = document.createElement('div');
    cell.className = 'cand';

    var n = document.createElement('div');
    n.className = 'n';
    n.textContent = (i + 1);
    cell.appendChild(n);

    var z = document.createElement('div');
    z.className = 'zc';
    z.style.fontFamily = '"' + font + '"';
    z.style.fontSize = size + 'px';
    z.textContent = parts.text;
    // Hovering gives the code points, which is what you compare against
    // golden data or against paiza_query's output.
    z.title = codePoints(parts.text);
    cell.appendChild(z);

    if (parts.meta) {
      var m = document.createElement('div');
      m.className = 'meta';
      m.textContent = parts.meta.replace(/,/g, '\n');
      cell.appendChild(m);
    }
    box.appendChild(cell);
  });
}

function query() {
  var key = $('key').value.trim();
  if (!key) { setStatus('请输入内容', 'err'); return; }
  var path = $('ep').value + encodeURIComponent(key);
  $('path').textContent = 'GET ' + path;
  setStatus('查询中…');
  $('go').disabled = true;
  var t0 = performance.now();

  fetch(path, { headers: { 'Accept': 'application/json' } })
    .then(function (r) { return r.text(); })
    .then(function (text) {
      $('raw').textContent = text;
      var data;
      try { data = JSON.parse(text); }
      catch (e) { setStatus('响应不是 JSON', 'err'); render([]); return; }

      if (data.ret === false) {
        setStatus('服务返回失败: ' + (data.error || data.retCode || ''), 'err');
        render([]);
        return;
      }
      // Every endpoint wraps its list the same way: data.obj, with
      // data.runTime in ms. /ime/{key} can also return a bare list.
      var payload = data.data;
      var items = [];
      var serverMs = null;
      if (Array.isArray(payload)) {
        items = payload;
      } else if (payload && Array.isArray(payload.obj)) {
        items = payload.obj;
        serverMs = payload.runTime;
      }
      render(items);
      var round = (performance.now() - t0).toFixed(0);
      setStatus('候选 ' + items.length + ' 条' +
                (serverMs !== null ? ',服务耗时 ' + serverMs + ' ms' : '') +
                ',往返 ' + round + ' ms', 'ok');
    })
    .catch(function (e) {
      setStatus('请求失败: ' + e.message + '(Java 服务起了吗?)', 'err');
      render([]);
    })
    .then(function () { $('go').disabled = false; });
}

$('go').addEventListener('click', query);
$('key').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') query();
});
$('clear').addEventListener('click', function () {
  $('key').value = '';
  $('results').innerHTML = '<span class="empty">还没有结果。</span>';
  $('raw').textContent = '—';
  setStatus('');
  $('key').focus();
});
// Changing the font or size should not need another request.
['font', 'size', 'limit'].forEach(function (id) {
  $(id).addEventListener('change', function () {
    var text = $('raw').textContent;
    if (!text || text === '—') return;
    try {
      var d = JSON.parse(text).data;
      render(Array.isArray(d) ? d : (d && d.obj) || []);
    } catch (e) {}
  });
});
$('ep').addEventListener('change', function () { $('key').focus(); });
</script>
</body>
</html>
